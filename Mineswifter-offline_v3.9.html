(() => {
  let spinner = document.querySelector("body > .spinner");
  let nodes = spinner.querySelectorAll("rect");
  let retry = document.querySelector("body > .retry");
  let index = 0, node_count = nodes.length;
  const update = () => {
    index++;
    if (index >= node_count) index = 0;
    let opacity = [1.0, 0.55, 0.25, 0.1];
    for (let i = 0, j = index; i < nodes.length; i++) {
      nodes[j].style.opacity = opacity[Math.min(i, opacity.length - 1)];
      if (--j < 0) j = node_count - 1;
    }
  }
  update();
  let interval = setInterval(() => {
    update();
    // detect the app being loaded
    let error = window.bzError;
    if (document.body.classList.length || error) {
      clearInterval(interval);
      spinner.style.display = "none";
      if (error) retry.style.display = "flex";
    }
  }, 100);
})();
